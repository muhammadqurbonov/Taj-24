<!doctype html><html lang="tg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>TAJ24 — Демо</title>
<style>

@media(min-width:520px){#app{border-left:1px solid var(--bd);border-right:1px solid var(--bd)}}
*{box-sizing:border-box}small,.mu{color:var(--mu);font-size:12.5px}
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 14px;font-weight:700;font-size:17px}
.ib{border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:12px;width:38px;height:38px;font-size:18px;cursor:pointer}
.logo{font-weight:900;font-size:24px;color:var(--g);letter-spacing:-1px}
.pill{background:var(--cd);border:1px solid var(--bd);border-radius:20px;padding:6px 12px;font-size:13px;cursor:pointer;margin-left:auto}
.sec{padding:0 14px;margin:18px 0 8px;display:flex;justify-content:space-between;align-items:center}.sec b{font-size:17px}.sec a{color:var(--g);font-size:13px;cursor:pointer}
.hs{display:flex;gap:10px;overflow-x:auto;padding:0 14px 4px;scrollbar-width:none}.hs>*{flex:none}.hs>.card{width:150px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:8px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.ph{height:108px;border-radius:10px;display:grid;place-items:center;font-size:52px;position:relative;background:linear-gradient(135deg,hsl(var(--h) 70% 91%),hsl(var(--h) 60% 80%))}
.ph.s{width:64px;height:64px;font-size:30px;flex:none}.ph.l{height:220px;font-size:110px;border-radius:16px}
.bd{position:absolute;top:6px;left:6px;background:var(--rd);color:#fff;font-size:11px;padding:2px 6px;border-radius:6px;font-weight:700}
.pr{font-weight:700}.pr s{color:var(--mu);font-weight:400;font-size:12px;margin-left:4px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.btn{background:var(--g);color:var(--on);border:0;border-radius:12px;padding:13px;font:inherit;font-weight:700;cursor:pointer;width:100%}.btn.o{background:var(--gl);color:var(--g)}.btn.r{background:transparent;color:var(--rd);border:1px solid var(--rd)}.btn:disabled{opacity:.5}
.add,.st button{background:var(--g);color:var(--on);border:0;width:32px;height:32px;border-radius:10px;font-size:19px;cursor:pointer}
.st{display:inline-flex;align-items:center;gap:8px;background:var(--gl);border-radius:12px;padding:2px}.st i{font-style:normal;min-width:18px;text-align:center;font-weight:700}
.chip{padding:8px 13px;border-radius:20px;background:var(--cd);border:1px solid var(--bd);cursor:pointer;white-space:nowrap;font-size:13px}.chip.on{background:var(--g);color:var(--on);border-color:var(--g)}
.box{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:0 14px 10px}
.opt{border:2px solid var(--bd);border-radius:12px;padding:11px;margin:6px 0;cursor:pointer;display:flex;gap:10px;align-items:center}.opt.on{border-color:var(--g);background:var(--gl)}
input,select{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--cd);color:var(--tx);font:inherit;margin:4px 0}
.bn{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);background:var(--cd);border-top:1px solid var(--bd);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
.bn div{flex:1;text-align:center;font-size:11px;color:var(--mu);cursor:pointer;padding:4px;position:relative}.bn div span{display:block;font-size:21px}.bn .on{color:var(--g);font-weight:700}
.bn em{position:absolute;top:0;left:56%;background:var(--rd);color:#fff;font-style:normal;font-size:10px;border-radius:10px;padding:1px 6px}
.bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);background:var(--cd);border-top:1px solid var(--bd);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;gap:10px;align-items:center}
.ban{margin:4px 14px;padding:20px;border-radius:18px;background:linear-gradient(135deg,#0b9a4b,#12b85f);color:#fff}.ban h2{margin:0 0 6px;font-size:21px}.ban button{margin-top:10px;background:#fff;color:#0b7a3b;border:0;border-radius:10px;padding:9px 16px;font-weight:700;cursor:pointer}
.cat{width:78px;text-align:center;font-size:12px;cursor:pointer}.cat b{display:grid;place-items:center;width:64px;height:64px;margin:0 auto 4px;border-radius:20px;background:var(--gl);font-size:30px}
.tl{display:flex;gap:10px;margin:0;padding:6px 0;align-items:center}.tl i{width:22px;height:22px;border-radius:50%;background:var(--bd);display:grid;place-items:center;font-size:12px;font-style:normal;color:var(--on)}.tl.d i{background:var(--g)}.tl.d{font-weight:600}.tl:not(.d){color:var(--mu)}
.tag{display:inline-block;background:var(--gl);color:var(--g);border-radius:8px;padding:2px 9px;font-size:12px;font-weight:700}.tag.x{background:#fde8e8;color:var(--rd)}
.ov{position:fixed;inset:0;background:#0008;z-index:20;display:flex;align-items:flex-end;justify-content:center}.ov>div{background:var(--bg);width:min(480px,100%);border-radius:20px 20px 0 0;padding:18px 14px calc(18px + env(safe-area-inset-bottom,0px))}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#14201a;color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;z-index:30;display:none;max-width:90%}
.ce{text-align:center;padding:50px 20px}.ce div{font-size:64px}.tr{display:flex;justify-content:space-between;padding:3px 0}.tr.t{font-weight:800;font-size:17px;border-top:1px dashed var(--bd);margin-top:6px;padding-top:8px}
details{padding:8px 0;border-bottom:1px solid var(--bd)}summary{cursor:pointer;font-weight:600}
</style></head><body><div id="app"></div><div id="ovl"></div><div id="toast"></div>
<script>
/* ===== Data ===== */
const $=s=>document.querySelector(s),e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),m=n=>(Math.round(n*100)/100)+' TJS';
const C=[['food','Хӯрокворӣ','🍞',35],['drink','Нӯшокиҳо','🥤',200],['fruit','Мева ва сабзавот','🍎',10],['home','Маҳсулоти хона','🧴',170],['tech','Техника','📱',250],['cloth','Либос','👕',330],['pharm','Дорухона','💊',140]].map(a=>({id:a[0],n:a[1],e:a[2],h:a[3]}));
const SH=[['m','Market 24','🛒',4.8,'08:00–23:00','Душанбе, Сино, кӯчаи Рудакӣ 45'],['s','Somon Market','🏪',4.6,'09:00–22:00','Душанбе, Шоҳмансур, кӯчаи Борбад 12'],['f','Fresh Market','🥬',4.9,'07:00–21:00','Душанбе, Фирдавсӣ, кӯчаи Сомонӣ 80'],['h','Home Market','🏠',4.5,'10:00–22:00','Душанбе, Сино, ҳиёбони Сомониён 7']].map(a=>({id:a[0],n:a[1],e:a[2],r:a[3],t:a[4],ad:a[5]}));
const P=[[1,'Нони тандурӣ',5,6,'food','m','🍞','Нони тозаи аз танӯри сангӣ баромада','1 дона'],[2,'Шири тозаи гов',14,0,'food','f','🥛','Шири пастеризатсияшуда, 2.5% равған','1 литр'],[3,'Панири сулугуни',38,45,'food','s','🧀','Панири нармии шӯр, истеҳсоли дохилӣ','400 г'],[4,'Равғани офтобпараст',32,0,'food','m','🌻','Равғани тозашуда барои пухтупаз','1 литр'],[5,'Оби минералӣ',6,0,'drink','m','💧','Оби минералии табиӣ, бе газ','1.5 литр'],[6,'Афшураи себ',15,0,'drink','s','🧃','Афшураи табиӣ бе шакар','1 литр'],[7,'Чойи сиёҳ',28,35,'drink','s','🍵','Чойи сиёҳи хушбӯй, пакетчагӣ','100 дона'],[8,'Қаҳваи фаврӣ',22,0,'drink','f','☕','Қаҳваи фаврии қавӣ','100 г'],[9,'Себи Ҳисорӣ',12,0,'fruit','f','🍎','Себҳои тару тоза аз боғи маҳаллӣ','1 кг'],[10,'Ангури ҳусайнӣ',25,30,'fruit','f','🍇','Ангури ширини мавсимӣ','1 кг'],[11,'Помидор',10,0,'fruit','f','🍅','Помидори сурху пурсифат','1 кг'],[12,'Бодиринг',8,0,'fruit','f','🥒','Бодиринги тару тоза','1 кг'],[13,'Собуни ҷомашӯӣ',45,52,'home','h','🧼','Хокаи ҷомашӯӣ барои ҳама намуди матоъ','3 кг'],[14,'Шампуни мӯй',36,0,'home','h','🧴','Шампуни ғизодиҳанда','400 мл'],[15,'Дастмоли коғазӣ',18,0,'home','h','🧻','Дастмолҳои коғазии нарм','2 ғалтак'],[16,'Лампаи LED',15,0,'home','h','💡','Лампаи сарфакор, нури гарм','12 Вт'],[17,'Гӯшмонаки беноқил',220,280,'tech','s','🎧','Садои возеҳ, 20 соат кор мекунад','Сиёҳ'],[18,'Заряднаки зуд',60,75,'tech','m','🔌','Заряднаки 33 Вт бо кабели USB-C','33 Вт'],[19,'Тасмаи фитнес',340,0,'tech','s','⌚','Шумораи қадам ва набзро ҳисоб мекунад','Сиёҳ',0],[20,'Футболкаи пахтагин',85,110,'cloth','h','👕','100% пахта, барои ҳар рӯз','Андоза M'],[21,'Ҷӯробҳо',24,0,'cloth','h','🧦','Ҷӯробҳои нарм, 3 ҷуфт','Андоза 41–45'],[22,'Витамини C',28,0,'pharm','m','🍊','Иловаи ғизоӣ барои масунияти бадан','60 ҳаб'],[23,'Парацетамол',9,0,'pharm','m','💊','Воситаи тапу дард','10 ҳаб'],[24,'Ниқоби тиббӣ',12,0,'pharm','m','😷','Ниқоби сеқабата','50 дона']].map(a=>({id:a[0],n:a[1],p:a[2],o:a[3],c:a[4],s:a[5],e:a[6],d:a[7],u:a[8],k:a[9]===0?0:1}));
const pd=id=>P.find(x=>x.id==id),sh=id=>SH.find(x=>x.id==id),cg=id=>C.find(x=>x.id==id);
const ST=['Қабул шуд','Дар омодагӣ','Барои расонидан омода','Курьер фармоишро гирифт','Дар роҳ','Расонида шуд'];
const PAY={cash:'Нақд ҳангоми расидан',wallet:'Пардохти электронӣ (демо)',card:'Корти бонкӣ (демо)'};
/* ===== State ===== */
const D0={cart:{},orders:[],ad:[{id:1,t:'Хона',s:'Душанбе, Сино, кӯчаи Рудакӣ',b:'45',a:'12',n:'Занги дарвозаро занед',p:'+992 90 123 45 67'},{id:2,t:'Кор',s:'Душанбе, Шоҳмансур, кӯчаи Борбад',b:'12',a:'3',n:'',p:'+992 90 123 45 67'}],out:0,nt:{o:1,p:1,n:0},init:0};
let S;try{S=JSON.parse(localStorage.getItem('taj24'))||structuredClone(D0)}catch(x){S=structuredClone(D0)}
const sv=()=>{try{localStorage.setItem('taj24',JSON.stringify(S))}catch(x){}};
let H=['home'],Q=1,F={q:'',max:0,sort:''},ck={a:0,d:'home',p:'cash',ps:'m',f:{}};
const price=(cart,del)=>{let sub=0,n=0;for(const k in cart){sub+=pd(k).p*cart[k];n+=cart[k]}const fee=!sub||del=='pickup'||sub>=150?0:12,dis=sub>=200?Math.round(sub*5)/100:0;return{sub,fee,dis,n,total:sub+fee-dis}};
function mk(items,del,pay,addr,step){const c={};items.forEach(i=>c[i[0]]=i[1]);const t=price(c,del);return{id:'TAJ-'+(100000+Math.floor(Math.random()*899999)),items:items.map(i=>({id:i[0],q:i[1],p:pd(i[0]).p})),...t,addr,pay,del,step,cancel:0,t:new Date().toLocaleDateString('ru-RU')+' '+new Date().toTimeString().slice(0,5)}}
if(!S.init){S.init=1;S.orders=[mk([[9,2],[2,1],[1,3]],'home','cash','Душанбе, Сино, кӯчаи Рудакӣ, бино 45, кв. 12',5)];sv()}
/* ===== Helpers ===== */
const ph=(p,c='')=>`<div class="ph ${c}" style="--h:${cg(p.c).h}">${p.e}${p.o&&c!='s'?`<span class=bd>−${Math.round(100-p.p/p.o*100)}%</span>`:''}</div>`;

const card=p=>{const q=S.cart[p.id]||0;return `<div class=card data-a=go data-v="prod:${p.id}">${ph(p)}<b>${p.n}</b><small>${p.u} · ${sh(p.s).n}</small><div class=row><span class=pr>${m(p.p)}${p.o?`<s>${m(p.o)}</s>`:''}</span>${!p.k?'<small>Тамом шуд</small>':q?stp(p.id,q):`<button class=add data-a=add data-v=${p.id}>+</button>`}</div></div>`};
const grid=a=>a.length?`<div class=grid>${a.map(card).join('')}</div>`:'<div class=ce><div>🔍</div>Чизе ёфт нашуд</div>';
const cnt=()=>Object.values(S.cart).reduce((a,b)=>a+b,0);
function toast(t){const o=$('#toast');o.textContent=t;o.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>o.style.display='none',1800)}
const cur=()=>H[H.length-1];
function go(r,reset){if(reset)H=[r];else H.push(r);render();scrollTo(0,0)}

const sec=(t,l)=>`<div class=sec><b>${t}</b>${l?`<a data-a=go data-v="${l}">Ҳама ›</a>`:''}</div>`;

const val=k=>e(ck.f[k]||'');
const form=()=>`<input name=s placeholder="Номи кӯча" value="${val('s')}" oninput="ck.f.s=this.value"><div class=row><input placeholder="Бино" value="${val('b')}" oninput="ck.f.b=this.value"><input placeholder="Квартира" value="${val('a')}" oninput="ck.f.a=this.value"></div><input placeholder="Нишона барои курьер" value="${val('n')}" oninput="ck.f.n=this.value"><input type=tel placeholder="Рақами телефон" value="${val('p')}" oninput="ck.f.p=this.value">`;
/* ===== Views ===== */
const V={
home(){const rec=[2,9,13,17,6,3,18].map(pd),nw=[24,21,20,16,10,8].map(pd),dc=P.filter(p=>p.o);
return `<div class=hd><span class=logo>TAJ24</span><span class=pill data-a=go data-v=addrs>📍 Душанбе, Сино ▾</span></div>
<div style="padding:0 14px"><input readonly placeholder="Мол ё хизматрасонӣ ҷустуҷӯ кунед" data-a=go data-v="list:" style="padding:13px 14px;cursor:pointer"></div>
<div class=ban style="margin-top:10px"><h2>Расонидан ройгон</h2>Аз 150 TJS ройгон ва аз 200 TJS — 5% тахфиф<br><button data-a=go data-v="list:">Харид кардан</button></div>
${sec('Категорияҳо','cats')}<div class=hs>${C.map(c=>`<div class=cat data-a=go data-v="list:${c.id}"><b>${c.e}</b>${c.n}</div>`).join('')}</div>
${sec('Мағозаҳои машҳур','stores')}<div class=hs>${SH.map(s=>`<div class=card style="width:150px" data-a=go data-v="store:${s.id}"><div class=ph style="--h:140;height:70px">${s.e}</div><b>${s.n}</b><small>★ ${s.r} · ${s.t.slice(0,5)}–${s.t.slice(6)}</small></div>`).join('')}</div>
${sec('Пешниҳодшуда')}<div class=hs>${rec.map(card).join('')}</div>${sec('Молҳои нав')}<div class=hs>${nw.map(card).join('')}</div>${sec('Маҳсулоти тахфифӣ 🔥')}<div class=hs>${dc.map(card).join('')}</div>`},

return `<div style="padding:0 14px">${ph(p,'l')}<h2 style="margin:12px 0 2px">${p.n}</h2><div class=row><span class=pr style="font-size:22px">${m(p.p)}${p.o?`<s>${m(p.o)}</s>`:''}</span><span class="tag ${p.k?'':'x'}">${p.k?'Дастрас аст':'Тамом шуд'}</span></div>

<div class="box row" style="margin:0 0 10px;cursor:pointer" data-a=go data-v="store:${s.id}"><span style="font-size:30px">${s.e}</span><span style="flex:1"><b>${s.n}</b><br><small>★ ${s.r} · ${s.t}</small></span>›</div></div>${sec('Монанд')}<div class=hs>${sim.map(card).join('')}</div>
<div class=bar>${stp2()}<button class=btn data-a=addq data-v=${p.id} ${p.k?'':'disabled'}>Ба сабад · ${m(p.p*Q)}</button></div>`},

<div class=box>${tot(t)}<small>Ройгон аз 150 TJS · Тахфиф 5% аз 200 TJS</small></div><div style="padding:0 14px;display:grid;gap:8px"><button class=btn data-a=go data-v=checkout>Ба тасдиқи фармоиш · ${m(t.total)}</button><button class="btn r" data-a=clr>Сабадро холӣ кардан</button></div>`},

<div class=box><b>2. ${home?'Суроғаи расонидан':'Мағозаи Pickup'}</b>${home?S.ad.map(x=>o('a',x.id,`<b>${e(x.t)}</b><br><small>${e(x.s)}, бино ${e(x.b)}, кв. ${e(x.a)}<br>${e(x.p)}</small>`)).join('')+o('a','new','➕ Суроғаи нав')+(ck.a=='new'?form():''):`<select onchange="ck.ps=this.value">${SH.map(s=>`<option value=${s.id} ${ck.ps==s.id?'selected':''}>${s.n} — ${s.ad}</option>`).join('')}</select>`}</div>
<div class=box><b>3. Усули пардохт</b>${Object.keys(PAY).map(k=>o('p',k,({cash:'💵',wallet:'📲',card:'💳'})[k]+' '+PAY[k])).join('')}</div><div class=box>${tot(t)}</div><div class=bar><button class=btn data-a=place>Тасдиқ кардан · ${m(t.total)}</button></div>`},
success(a){const o=S.orders.find(x=>x.id==a);return `<div class=ce><div>✅</div><h2>Фармоиш қабул шуд!</h2><span class=tag>DEMO · ${o.id}</span></div><div class=box><div class=tr><span class=mu>Маблағи умумӣ</span><b>${m(o.total)}</b></div><div class=tr><span class=mu>Суроға</span><b style="text-align:right;max-width:60%">${e(o.addr)}</b></div><div class=tr><span class=mu>Пардохт</span><b>${PAY[o.pay]}</b></div><div class=tr><span class=mu>Муҳлат</span><b>${o.del=='home'?'35–50 дақиқа':'~20 дақиқа'}</b></div></div><div style="padding:0 14px;display:grid;gap:8px"><button class=btn data-a=ords data-v=${o.id}>Дидани фармоиш</button><button class="btn o" data-a=tab data-v=home>Ба саҳифаи асосӣ</button></div>`},
orders(){return S.orders.length?S.orders.map(o=>`<div class=box style="cursor:pointer" data-a=go data-v="order:${o.id}"><div class=row><b>${o.id}</b>${stag(o)}</div><div class=row><small>${o.t} · ${o.items.length} маҳсулот</small><b>${m(o.total)}</b></div></div>`).join(''):`<div class=ce><div>📦</div><b>Ҳоло фармоиш нест</b></div>`},
order(a){const o=S.orders.find(x=>x.id==a);return `<div class=box><div class=row><b>${o.id}</b>${stag(o)}</div><small>${o.t}</small><div style="margin-top:8px">${o.cancel?'<div class=tl><i style="background:var(--rd)">✕</i>Бекор шуд</div>':ST.map((s,i)=>`<div class="tl ${i<=o.step?'d':''}"><i>${i<=o.step?'✓':''}</i>${s}</div>`).join('')}</div>${!o.cancel&&o.step<5?`<div style="display:grid;gap:8px;margin-top:8px"><button class=btn data-a=next data-v=${o.id}>Қадами навбатӣ (демо)</button>${o.step<4?`<button class="btn r" data-a=cncl data-v=${o.id}>Бекор кардан</button>`:''}</div><small>Тағйирёбии status танҳо simulation аст.</small>`:''}</div>
<div class=box><b>Маҳсулот</b>${o.items.map(i=>{const p=pd(i.id);return `<div class=tr><span>${p.e} ${p.n} × ${i.q}</span><span>${m(i.p*i.q)}</span></div>`}).join('')}<hr style="border:0;border-top:1px solid var(--bd)">${tot(o)}</div><div class=box><div class=tr><span class=mu>Суроға</span><b style="text-align:right;max-width:62%">${e(o.addr)}</b></div><div class=tr><span class=mu>Пардохт</span><b>${PAY[o.pay]}</b></div></div>`},
profile(){const R=(i,t,v,x='')=>`<div class="box row" style="cursor:pointer" ${v}><span>${i} ${t}</span><span class=mu>${x} ›</span></div>`;return `<div class="box row" style="justify-content:flex-start;gap:14px"><span style="width:60px;height:60px;border-radius:50%;background:var(--g);color:var(--on);display:grid;place-items:center;font-weight:800;font-size:22px">ФР</span><span><b style="font-size:18px">Фарҳод Раҳимов</b><br><small>+992 90 123 45 67 (демо)</small></span></div>
${R('📍','Суроғаҳои ман','data-a=go data-v=addrs',S.ad.length)}${R('📦','Фармоишҳои ман','data-a=tab data-v=orders',S.orders.length)}${R('🌐','Забон','data-a=go data-v=info:lang','Тоҷикӣ')}${R('🔔','Огоҳиномаҳо','data-a=go data-v=info:nt')}${R('💬','Кӯмак ва дастгирӣ','data-a=go data-v=info:help')}${R('⚙️','Танзимот','data-a=go data-v=info:set')}<div style="padding:0 14px"><button class="btn r" data-a=out>Баромадан</button></div>`},
addrs(){return `${S.ad.map(x=>`<div class="box row"><span><b>${e(x.t)}</b><br><small>${e(x.s)}, бино ${e(x.b)}, кв. ${e(x.a)}<br>${e(x.p)}</small></span><button class=ib data-a=dad data-v=${x.id}>🗑</button></div>`).join('')}<div class=box><b>Суроғаи нав</b>${form()}<button class=btn data-a=sad>Захира кардан</button></div>`},
info(a){if(a=='lang')return `<div class=box>${[['Тоҷикӣ',1],['Русский',0],['English',0]].map(l=>`<div class=opt ${l[1]?'':'data-a=toast2'}><span style="flex:1">${l[0]}</span>${l[1]?'✔':''}</div>`).join('')}<small>Дар демо танҳо забони тоҷикӣ фаъол аст.</small></div>`;
if(a=='nt')return `<div class=box>${[['o','Ҳолати фармоиш'],['p','Тахфифҳо ва пешниҳодҳо'],['n','Навгониҳо']].map(x=>`<div class="opt ${S.nt[x[0]]?'on':''}" data-a=nt data-v=${x[0]}><span style="flex:1">${x[1]}</span>${S.nt[x[0]]?'Фаъол':'Хомӯш'}</div>`).join('')}</div>`;
if(a=='help')return `<div class=box><b>Алоқа бо дастгирӣ</b><p>📞 +992 44 600 24 24<br>✉️ support@taj24.demo<br>🕘 Ҳар рӯз 08:00–22:00</p></div><div class=box><b>Саволҳои зуд-зуд</b><details><summary>Расонидан чӣ қадар вақт мегирад?</summary><p class=mu>Одатан 35–50 дақиқа дар дохили шаҳр.</p></details><details><summary>Чӣ тавр фармоишро бекор кунам?</summary><p class=mu>Дар тафсилоти фармоиш, то омодашавӣ барои курьер.</p></details><details><summary>Расонидан кай ройгон аст?</summary><p class=mu>Аз 150 TJS.</p></details></div>`;
return `<div class=box><div class=tr><span>Версия</span><b>TAJ24 Demo 1.0</b></div><p class=mu>Ҳамаи маълумот дар браузери шумо (localStorage) нигоҳ дошта мешавад. Пардохти воқеӣ вуҷуд надорад.</p><button class="btn r" data-a=reset>Барқарор кардани маълумоти демо</button></div>`}};
const T={cats:'Категорияҳо',list:'Каталог',prod:'Тафсилоти маҳсулот',stores:'Мағозаҳо',store:'Мағоза',cart:'Сабад',checkout:'Тасдиқи фармоиш',orders:'Фармоишҳои ман',order:'Тафсилоти фармоиш',profile:'Профил',addrs:'Суроғаҳои ман'},IT={lang:'Забон',nt:'Огоҳиномаҳо',help:'Кӯмак ва дастгирӣ',set:'Танзимот'};
const stag=o=>`<span class="tag ${o.cancel?'x':''}">${o.cancel?'Бекор шуд':ST[o.step]}</span>`;
const stp2=()=>`<span class=st><button data-a=qm>−</button><i>${Q}</i><button data-a=qp>+</button></span>`;
function flt(f){let r=P.filter(p=>(!f||p.c==f)&&(!F.max||p.p<=F.max)&&(!F.q||(p.n+p.d+sh(p.s).n).toLowerCase().includes(F.q.toLowerCase())));if(F.sort)r=r.slice().sort((a,b)=>F.sort=='asc'?a.p-b.p:b.p-a.p);return r}
function fl(){const l=$('#lst');if(l)l.innerHTML=grid(flt(cur().split(':')[1]))}
function render(){const y=scrollY,[r,a]=cur().split(':');
if(S.out){$('#app').innerHTML=`<div class=ce style="padding-top:90px"><div class=logo style="font-size:48px">TAJ24</div><p class=mu>Харид, фармоиш ва хизматрасонӣ дар як ҷо</p><input type=tel value="+992 90 123 45 67" style="text-align:center"><button class=btn data-a=login>Ворид шудан</button><small>Демо — рамз талаб карда намешавад</small></div>`;return}
const tabs=['home','cats','cart','orders','profile'],nb=!['prod','checkout','success','store','order','addrs','info','list','stores'].includes(r)||H.length==1&&r!='success';
const title=r=='info'?IT[a]:T[r];
const hd=r=='home'||r=='success'?'':`<div class=hd>${H.length>1?'<button class=ib data-a=back>‹</button>':''}${title}${r=='list'||r=='cats'||r=='store'||r=='stores'?`<span class=pill data-a=tab data-v=cart>🛒 ${cnt()}</span>`:''}</div>`;
const nav=['🏠 Асосӣ|home','🗂 Категорияҳо|cats','🛒 Сабад|cart','📦 Фармоишҳо|orders','👤 Профил|profile'].map(x=>{const[l,k]=x.split('|'),[i,...t]=l.split(' ');return `<div class="${H[0]==k?'on':''}" data-a=tab data-v=${k}><span>${i}</span>${t.join(' ')}${k=='cart'&&cnt()?`<em>${cnt()}</em>`:''}</div>`}).join('');
$('#app').innerHTML=hd+V[r](a)+(['prod','checkout','success'].includes(r)||(r=='cart'&&0)?'':`<div class=bn>${nav}</div>`);
if(r=='checkout'&&!cnt())return;scrollTo(0,y)}
/* ===== Actions ===== */
function finish(){const t=price(S.cart,ck.d);let ad;if(ck.d=='home'){let x=S.ad.find(z=>z.id==ck.a);if(!x){x={id:Date.now(),t:'Нав',s:ck.f.s,b:ck.f.b||'-',a:ck.f.a||'-',n:ck.f.n||'',p:ck.f.p};S.ad.push(x)}ad=`${x.s}, бино ${x.b}, кв. ${x.a}`+(x.n?` (${x.n})`:'')}else{const s=sh(ck.ps);ad=`Pickup: ${s.n}, ${s.ad}`}
const o=mk(Object.keys(S.cart).map(k=>[+k,S.cart[k]]),ck.d,ck.p,ad,0);S.orders.unshift(o);S.cart={};ck={a:0,d:'home',p:'cash',ps:'m',f:{}};sv();$('#ovl').innerHTML='';go('success:'+o.id,1)}
const A={go:v=>go(v),tab:v=>go(v,1),back,
cat:v=>{H[H.length-1]='list:'+v;render()},mx:v=>{F.max=+v;render()},
add:v=>{S.cart[v]=(S.cart[v]||0)+1;sv();render();toast('Ба сабад илова шуд')},

clr:()=>{S.cart={};sv();render()},qp:()=>{Q++;render()},qm:()=>{Q=Math.max(1,Q-1);render()},
addq:v=>{S.cart[v]=(S.cart[v]||0)+Q;Q=1;sv();toast('Ба сабад илова шуд ✔');back()},
ck:v=>{const[k,x]=v.split(':');ck[k]=k=='a'&&x!='new'?+x:x;render()},

if(ck.p=='cash')return finish();$('#ovl').innerHTML=`<div class=ov><div><b>${PAY[ck.p]}</b><p class=mu style="margin:4px 0">Демо — маълумоти воқеии корт ворид накунед. Ҳеҷ чиз нигоҳ дошта намешавад.</p>${ck.p=='card'?'<input placeholder="Рақами корт (демо)" inputmode=numeric autocomplete=off><div class=row><input placeholder="ММ/СС" autocomplete=off><input placeholder="CVV" autocomplete=off></div>':'<div class=box style="margin:8px 0;text-align:center;font-size:40px">📲<br><small>Тасдиқи пардохт дар ҳамёни демо</small></div>'}<button class=btn id=pb data-a=pay>Пардохт кардан</button><button class="btn o" style="margin-top:8px" data-a=cl>Бекор кардан</button></div></div>`},
cl:()=>$('#ovl').innerHTML='',pay:(v,t)=>{t.disabled=1;t.textContent='Коркард…';setTimeout(finish,1200)},
ords:v=>{H=['orders','order:'+v];render();scrollTo(0,0)},
next:v=>{const o=S.orders.find(x=>x.id==v);if(o.step<5)o.step++;sv();render();toast(ST[o.step])},
cncl:v=>{S.orders.find(x=>x.id==v).cancel=1;sv();render()},
sad:()=>{if(!(ck.f.s||'').trim()||!(ck.f.p||'').trim())return toast('Кӯча ва телефонро ворид кунед');S.ad.push({id:Date.now(),t:'Нав',s:ck.f.s,b:ck.f.b||'-',a:ck.f.a||'-',n:ck.f.n||'',p:ck.f.p});ck.f={};sv();render();toast('Суроға захира шуд')},
dad:v=>{S.ad=S.ad.filter(x=>x.id!=v);ck.a=0;sv();render()},
nt:v=>{S.nt[v]=S.nt[v]?0:1;sv();render()},toast2:()=>toast('Ин забон ба зудӣ илова мешавад'),
out:()=>{S.out=1;H=['home'];sv();render()},login:()=>{S.out=0;sv();render()},
reset:()=>{try{localStorage.removeItem('taj24')}catch(x){}S=structuredClone(D0);S.init=1;S.orders=[mk([[9,2],[2,1],[1,3]],'home','cash','Душанбе, Сино, кӯчаи Рудакӣ, бино 45, кв. 12',5)];sv();H=['home'];render();toast('Маълумот барқарор шуд')}};
document.addEventListener('click',ev=>{const t=ev.target.closest('[data-a]');if(t&&A[t.dataset.a])A[t.dataset.a](t.dataset.v,t)});
render();
