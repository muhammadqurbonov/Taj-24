<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>TAJ24</title>
<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

#app{max-width:480px;margin:0 auto;padding-bottom:90px;min-height:100vh;background:var(--bg)}
@media(min-width:520px){#app{border-left:1px solid var(--bd);border-right:1px solid var(--bd)}}
*{box-sizing:border-box}small,.mu{color:var(--mu);font-size:12.5px}
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 14px;font-weight:700;font-size:18px}
.ib{border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:10px;width:38px;height:38px;font-size:18px;cursor:pointer}
.logo{font-weight:800;font-size:23px;color:var(--g);letter-spacing:-.5px}
.pill{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:7px 11px;font-size:13px;cursor:pointer;margin-left:auto;font-weight:500}
.sec{padding:0 14px;margin:20px 0 8px;display:flex;justify-content:space-between;align-items:baseline}.sec b{font-size:17px}.sec a{color:var(--g);font-size:13px;cursor:pointer}
.hs{display:flex;gap:10px;overflow-x:auto;padding:0 14px 4px;scrollbar-width:none}.hs>*{flex:none}.hs>.card{width:148px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:8px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.ph{height:104px;border-radius:8px;display:grid;place-items:center;font-size:50px;position:relative;background:hsl(var(--h) 38% 93%)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .ph{background:hsl(var(--h) 18% 24%)}}

.bd{position:absolute;top:6px;left:6px;background:var(--rd);color:#fff;font-size:11px;padding:2px 6px;border-radius:5px;font-weight:600}
.pr{font-weight:700}.pr s{color:var(--mu);font-weight:400;font-size:12px;margin-left:5px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.btn{background:var(--g);color:var(--on);border:0;border-radius:10px;padding:13px;font:inherit;font-weight:600;cursor:pointer;width:100%}.btn.o{background:var(--gl);color:var(--g)}.btn.r{background:transparent;color:var(--rd);border:1px solid var(--bd)}.btn:disabled{opacity:.5}
.add,.st button{background:var(--g);color:var(--on);border:0;width:32px;height:32px;border-radius:8px;font-size:19px;cursor:pointer}
.st{display:inline-flex;align-items:center;gap:6px;background:var(--gl);border-radius:10px;padding:2px}.st i{font-style:normal;min-width:20px;text-align:center;font-weight:600}
.chip{padding:8px 13px;border-radius:8px;background:var(--cd);border:1px solid var(--bd);cursor:pointer;white-space:nowrap;font-size:13px}.chip.on{background:var(--g);color:var(--on);border-color:var(--g)}
.box{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:13px;margin:0 14px 10px}
.opt{border:1.5px solid var(--bd);border-radius:10px;padding:11px;margin:7px 0;cursor:pointer;display:flex;gap:10px;align-items:center}.opt.on{border-color:var(--g);background:var(--gl)}
input,select{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--cd);color:var(--tx);font:inherit;margin:4px 0}
.bn{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);background:var(--cd);border-top:1px solid var(--bd);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
.bn div{flex:1;text-align:center;font-size:11px;color:var(--mu);cursor:pointer;padding:4px;position:relative}.bn svg{display:block;margin:0 auto 2px;width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.bn .on{color:var(--g);font-weight:600}
.bn em{position:absolute;top:0;left:56%;background:var(--g);color:var(--on);font-style:normal;font-size:10px;border-radius:9px;padding:1px 6px;font-weight:600}
.bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);background:var(--cd);border-top:1px solid var(--bd);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;gap:10px;align-items:center}
.ban{margin:10px 14px 4px;padding:20px;border-radius:14px;background:#0b8f46;color:#fff}.ban h2{margin:0 0 4px;font-size:20px}.ban button{margin-top:12px;background:#fff;color:#0b7a3b;border:0;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer}
.cat{width:80px;text-align:center;font-size:12px;cursor:pointer}.cat b{display:grid;place-items:center;width:62px;height:62px;margin:0 auto 5px;border-radius:14px;background:var(--cd);border:1px solid var(--bd);font-size:28px}
.tl{display:flex;gap:10px;padding:6px 0;align-items:center}.tl i{width:20px;height:20px;border-radius:50%;background:var(--bd);display:grid;place-items:center;font-size:11px;font-style:normal;color:var(--on)}.tl.d i{background:var(--g)}.tl.d{font-weight:600}.tl:not(.d){color:var(--mu)}
.tag{display:inline-block;background:var(--gl);color:var(--g);border-radius:6px;padding:2px 9px;font-size:12px;font-weight:600}.tag.x{background:#fde8e8;color:var(--rd)}
.ov{position:fixed;inset:0;background:#0008;z-index:20;display:flex;align-items:flex-end;justify-content:center}.ov>div{background:var(--bg);width:min(480px,100%);border-radius:16px 16px 0 0;padding:18px 14px calc(18px + env(safe-area-inset-bottom,0px))}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#222a26;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:30;display:none;max-width:90%}
.ce{text-align:center;padding:50px 20px}.ce div{font-size:56px}.tr{display:flex;justify-content:space-between;padding:3px 0}.tr.t{font-weight:700;font-size:16px;border-top:1px solid var(--bd);margin-top:6px;padding-top:8px}
details{padding:9px 0;border-bottom:1px solid var(--bd)}summary{cursor:pointer;font-weight:500}
</style></head><body><div id="app"></div><div id="ovl"></div><div id="toast"></div>
<script>
/* ===== Данные ===== */

const P=[[1,'Лепёшка тандырная',5,6,'food','m','🍞','Свежая лепёшка из каменной печи','1 шт.'],[2,'Молоко фермерское',14,0,'food','f','🥛','Пастеризованное, жирность 2,5%','1 л'],[3,'Сыр сулугуни',38,45,'food','s','🧀','Мягкий солёный сыр местного производства','400 г'],[4,'Масло подсолнечное',32,0,'food','m','🌻','Рафинированное, для жарки и салатов','1 л'],[5,'Вода минеральная',6,0,'drink','m','💧','Природная, негазированная','1,5 л'],[6,'Яблочный сок',15,0,'drink','s','🧃','Натуральный сок без сахара','1 л'],[7,'Чай чёрный',28,35,'drink','s','🍵','Ароматный чай в пакетиках','100 шт.'],[8,'Кофе растворимый',22,0,'drink','f','☕','Крепкий растворимый кофе','100 г'],[9,'Яблоки хисорские',12,0,'fruit','f','🍎','Сочные яблоки из местных садов','1 кг'],[10,'Виноград хусайни',25,30,'fruit','f','🍇','Сладкий сезонный виноград','1 кг'],[11,'Помидоры',10,0,'fruit','f','🍅','Спелые красные помидоры','1 кг'],[12,'Огурцы',8,0,'fruit','f','🥒','Свежие хрустящие огурцы','1 кг'],[13,'Стиральный порошок',45,52,'home','h','🧼','Для всех видов тканей','3 кг'],[14,'Шампунь',36,0,'home','h','🧴','Питательный шампунь для волос','400 мл'],[15,'Бумажные полотенца',18,0,'home','h','🧻','Мягкие двухслойные полотенца','2 рулона'],[16,'Лампа светодиодная',15,0,'home','h','💡','Энергосберегающая, тёплый свет','12 Вт'],[17,'Беспроводные наушники',220,280,'tech','s','🎧','Чистый звук, до 20 часов работы','Чёрные'],[18,'Быстрая зарядка',60,75,'tech','m','🔌','Зарядка 33 Вт с кабелем USB-C','33 Вт'],[19,'Фитнес-браслет',340,0,'tech','s','⌚','Считает шаги и пульс','Чёрный',0],[20,'Футболка хлопковая',85,110,'cloth','h','👕','100% хлопок, на каждый день','Размер M'],[21,'Носки',24,0,'cloth','h','🧦','Мягкие носки, 3 пары','Размер 41–45'],[22,'Витамин C',28,0,'pharm','m','🍊','Биодобавка для иммунитета','60 таб.'],[23,'Парацетамол',9,0,'pharm','m','💊','Жаропонижающее и обезболивающее','10 таб.'],[24,'Маски медицинские',12,0,'pharm','m','😷','Трёхслойные','50 шт.']].map(a=>({id:a[0],n:a[1],p:a[2],o:a[3],c:a[4],s:a[5],e:a[6],d:a[7],u:a[8],k:a[9]===0?0:1}));
const pd=id=>P.find(x=>x.id==id),sh=id=>SH.find(x=>x.id==id),cg=id=>C.find(x=>x.id==id);
const ST=['Принят','Готовится','Готов к выдаче','Курьер забрал заказ','В пути','Доставлен'];
const PAY={cash:'Наличными при получении',wallet:'Электронный кошелёк',card:'Банковской картой'};
const D0={cart:{},orders:[],ad:[{id:1,t:'Дом',s:'Душанбе, Сино, ул. Рудаки',b:'45',a:'12',n:'Позвоните в домофон',p:'+992 90 123 45 67'},{id:2,t:'Работа',s:'Душанбе, Шохмансур, ул. Борбад',b:'12',a:'3',n:'',p:'+992 90 123 45 67'}],out:0,nt:{o:1,p:1,n:0},init:0};
let S;try{S=JSON.parse(localStorage.getItem('taj24ru'))||structuredClone(D0)}catch(x){S=structuredClone(D0)}
const sv=()=>{try{localStorage.setItem('taj24ru',JSON.stringify(S))}catch(x){}};
let H=['home'],Q=1,F={q:'',max:0,sort:''},ck={a:0,d:'home',p:'cash',ps:'m',f:{}};
const price=(cart,del)=>{let sub=0,n=0;for(const k in cart){sub+=pd(k).p*cart[k];n+=cart[k]}const fee=!sub||del=='pickup'||sub>=150?0:12,dis=sub>=200?Math.round(sub*5)/100:0;return{sub,fee,dis,n,total:sub+fee-dis}};
function mk(items,del,pay,addr,step){const c={};items.forEach(i=>c[i[0]]=i[1]);const t=price(c,del),d=new Date();return{id:'TAJ-'+(100000+Math.floor(Math.random()*899999)),items:items.map(i=>({id:i[0],q:i[1],p:pd(i[0]).p})),...t,addr,pay,del,step,cancel:0,t:d.toLocaleDateString('ru-RU')+', '+d.toTimeString().slice(0,5)}}
const seed=()=>[mk([[9,2],[2,1],[1,3]],'home','cash','Душанбе, Сино, ул. Рудаки, 45, кв. 12',5)];
if(!S.init){S.init=1;S.orders=seed();sv()}

const IC={home:'<path d="M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/>',cats:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',cart:'<path d="M3 4h3l2.5 11h10L21 7H7"/><circle cx="9" cy="19.5" r="1.2"/><circle cx="18" cy="19.5" r="1.2"/>',orders:'<path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 8h6M9 12h6"/>',profile:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>'};
const ph=(p,c='')=>`<div class="ph ${c}" style="--h:${cg(p.c).h}">${p.e}${p.o&&c!='s'?`<span class=bd>−${Math.round(100-p.p/p.o*100)}%</span>`:''}</div>`;

/* ===== Экраны ===== */
const V={
home(){const rec=[2,9,13,17,6,3,18].map(pd),nw=[24,21,20,16,10,8].map(pd),dc=P.filter(p=>p.o);
return `<div class=hd><span class=logo>TAJ24</span><span class=pill data-a=go data-v=addrs>Душанбе, Сино ▾</span></div>
<div style="padding:0 14px"><input readonly placeholder="Поиск товаров и услуг" data-a=go data-v="list:" style="padding:13px 14px;cursor:pointer"></div>
<div class=ban><h2>Бесплатная доставка</h2>При заказе от 150 сом. Скидка 5% от 200 сом.<br><button data-a=go data-v="list:">В каталог</button></div>
${sec('Категории','cats')}<div class=hs>${C.map(c=>`<div class=cat data-a=go data-v="list:${c.id}"><b>${c.e}</b>${c.n}</div>`).join('')}</div>

${sec('Рекомендуем')}<div class=hs>${rec.map(card).join('')}</div>${sec('Новинки')}<div class=hs>${nw.map(card).join('')}</div>${sec('Скидки')}<div class=hs>${dc.map(card).join('')}</div>`},

<p>${p.d}</p><div class=box style="margin:0 0 10px"><div class=tr><span class=mu>Объём / размер</span><b>${p.u}</b></div><div class=tr><span class=mu>Категория</span><b>${cg(p.c).n}</b></div></div>
<div class="box row" style="margin:0 0 10px;cursor:pointer" data-a=go data-v="store:${s.id}"><span style="font-size:28px">${s.e}</span><span style="flex:1"><b>${s.n}</b><br><small>★ ${s.r} · ${s.t}</small></span>›</div></div>${sec('Похожие товары')}<div class=hs>${sim.map(card).join('')}</div>
<div class=bar>${stp2()}<button class=btn data-a=addq data-v=${p.id} ${p.k?'':'disabled'}>В корзину · ${m(p.p*Q)}</button></div>`},
stores(){return SH.map(s=>`<div class="box row" style="cursor:pointer" data-a=go data-v="store:${s.id}"><span style="font-size:36px">${s.e}</span><span style="flex:1"><b>${s.n}</b><br><small>★ ${s.r} · ${s.t}<br>${s.ad}</small></span>›</div>`).join('')},
store(a){const s=sh(a);return `<div class=box><div class=row style="justify-content:flex-start;gap:14px"><span style="font-size:46px">${s.e}</span><span><b style="font-size:18px">${s.n}</b><br><small>★ ${s.r} · Часы работы: ${s.t}</small></span></div><p class=mu>${s.ad}</p></div>${sec('Товары магазина')}${grid(P.filter(p=>p.s==a))}`},
cart(){const ks=Object.keys(S.cart);if(!ks.length)return `<div class=ce><div>🛒</div><b>В корзине пока пусто</b><p class=mu>Добавьте товары из каталога</p><button class=btn data-a=go data-v="list:">Перейти в каталог</button></div>`;const t=price(S.cart,'home');
return `${ks.map(k=>{const p=pd(k),q=S.cart[k];return `<div class="box row">${ph(p,'s')}<span style="flex:1"><b>${p.n}</b><br><small>${m(p.p)} · ${p.u}</small><div class=row style="margin-top:6px">${stp(k,q)}<b>${m(p.p*q)}</b></div></span><button class=ib data-a=del data-v=${k}>✕</button></div>`}).join('')}
<div class=box>${tot(t)}<small>Бесплатная доставка от 150 сом. · скидка 5% от 200 сом.</small></div><div style="padding:0 14px;display:grid;gap:8px"><button class=btn data-a=go data-v=checkout>Оформить заказ · ${m(t.total)}</button><button class="btn r" data-a=clr>Очистить корзину</button></div>`},
checkout(){if(!cnt())return V.cart();if(!ck.a)ck.a=S.ad[0]?S.ad[0].id:'new';const t=price(S.cart,ck.d),home=ck.d=='home';
const o=(k,v,l)=>`<div class="opt ${ck[k]==v?'on':''}" data-a=ck data-v="${k}:${v}"><span style="flex:1">${l}</span>${ck[k]==v?'<b style="color:var(--g)">✓</b>':''}</div>`;
return `<div class=box><b>Способ получения</b>${o('d','home','Доставка курьером<br><small>35–50 минут</small>')}${o('d','pickup','Самовывоз из магазина<br><small>Будет готов примерно через 20 минут</small>')}</div>
<div class=box><b>${home?'Адрес доставки':'Магазин для самовывоза'}</b>${home?S.ad.map(x=>o('a',x.id,`<b>${e(x.t)}</b><br><small>${e(x.s)}, д. ${e(x.b)}, кв. ${e(x.a)}<br>${e(x.p)}</small>`)).join('')+o('a','new','Новый адрес')+(ck.a=='new'?form():''):`<select onchange="ck.ps=this.value">${SH.map(s=>`<option value=${s.id} ${ck.ps==s.id?'selected':''}>${s.n} — ${s.ad}</option>`).join('')}</select>`}</div>
<div class=box><b>Способ оплаты</b>${Object.keys(PAY).map(k=>o('p',k,PAY[k])).join('')}</div><div class=box>${tot(t)}</div><div class=bar><button class=btn data-a=place>Подтвердить заказ · ${m(t.total)}</button></div>`},
success(a){const o=S.orders.find(x=>x.id==a);return `<div class=ce><div>✅</div><h2>Заказ оформлен</h2><span class=tag>Заказ ${o.id}</span></div><div class=box><div class=tr><span class=mu>Сумма</span><b>${m(o.total)}</b></div><div class=tr><span class=mu>Адрес</span><b style="text-align:right;max-width:60%">${e(o.addr)}</b></div><div class=tr><span class=mu>Оплата</span><b>${PAY[o.pay]}</b></div><div class=tr><span class=mu>Ожидаемое время</span><b>${o.del=='home'?'35–50 минут':'~20 минут'}</b></div></div><div style="padding:0 14px;display:grid;gap:8px"><button class=btn data-a=ords data-v=${o.id}>Смотреть заказ</button><button class="btn o" data-a=tab data-v=home>На главную</button></div>`},
orders(){return S.orders.length?S.orders.map(o=>`<div class=box style="cursor:pointer" data-a=go data-v="order:${o.id}"><div class=row><b>${o.id}</b>${stag(o)}</div><div class=row><small>${o.t} · ${o.items.length} поз.</small><b>${m(o.total)}</b></div></div>`).join(''):`<div class=ce><div>📦</div><b>Заказов пока нет</b></div>`},
order(a){const o=S.orders.find(x=>x.id==a);return `<div class=box><div class=row><b>${o.id}</b>${stag(o)}</div><small>${o.t}</small><div style="margin-top:8px">${o.cancel?'<div class=tl><i style="background:var(--rd)">✕</i>Заказ отменён</div>':ST.map((s,i)=>`<div class="tl ${i<=o.step?'d':''}"><i>${i<=o.step?'✓':''}</i>${s}</div>`).join('')}</div>${!o.cancel&&o.step<5?`<div style="display:grid;gap:8px;margin-top:8px"><button class=btn data-a=next data-v=${o.id}>Следующий шаг</button>${o.step<4?`<button class="btn r" data-a=cncl data-v=${o.id}>Отменить заказ</button>`:''}</div><small>Смена статуса — симуляция для демонстрации.</small>`:''}</div>
<div class=box><b>Состав заказа</b>${o.items.map(i=>{const p=pd(i.id);return `<div class=tr><span>${p.n} × ${i.q}</span><span>${m(i.p*i.q)}</span></div>`}).join('')}<hr style="border:0;border-top:1px solid var(--bd)">${tot(o)}</div><div class=box><div class=tr><span class=mu>Адрес</span><b style="text-align:right;max-width:62%">${e(o.addr)}</b></div><div class=tr><span class=mu>Оплата</span><b>${PAY[o.pay]}</b></div></div>`},
profile(){const R=(t,v,x='')=>`<div class="box row" style="cursor:pointer" ${v}><span>${t}</span><span class=mu>${x} ›</span></div>`;return `<div class="box row" style="justify-content:flex-start;gap:14px"><span style="width:58px;height:58px;border-radius:50%;background:var(--gl);color:var(--g);display:grid;place-items:center;font-weight:700;font-size:21px">ФР</span><span><b style="font-size:18px">Фарход Рахимов</b><br><small>+992 90 123 45 67</small></span></div>
${R('Мои адреса','data-a=go data-v=addrs',S.ad.length)}${R('Мои заказы','data-a=tab data-v=orders',S.orders.length)}${R('Язык','data-a=go data-v=info:lang','Русский')}${R('Уведомления','data-a=go data-v=info:nt')}${R('Помощь и поддержка','data-a=go data-v=info:help')}${R('Настройки','data-a=go data-v=info:set')}<div style="padding:0 14px"><button class="btn r" data-a=out>Выйти</button></div>`},
addrs(){return `${S.ad.map(x=>`<div class="box row"><span><b>${e(x.t)}</b><br><small>${e(x.s)}, д. ${e(x.b)}, кв. ${e(x.a)}<br>${e(x.p)}</small></span><button class=ib data-a=dad data-v=${x.id}>✕</button></div>`).join('')}<div class=box><b>Новый адрес</b>${form()}<button class=btn data-a=sad>Сохранить адрес</button></div>`},
info(a){if(a=='lang')return `<div class=box>${[['Русский',1],['Тоҷикӣ',0],['English',0]].map(l=>`<div class="opt ${l[1]?'on':''}" ${l[1]?'':'data-a=toast2'}><span style="flex:1">${l[0]}</span>${l[1]?'✓':''}</div>`).join('')}</div>`;
if(a=='nt')return `<div class=box>${[['o','Статус заказа'],['p','Акции и скидки'],['n','Новости TAJ24']].map(x=>`<div class="opt ${S.nt[x[0]]?'on':''}" data-a=nt data-v=${x[0]}><span style="flex:1">${x[1]}</span>${S.nt[x[0]]?'Вкл.':'Выкл.'}</div>`).join('')}</div>`;
if(a=='help')return `<div class=box><b>Связаться с нами</b><p>+992 44 600 24 24<br>support@taj24.tj<br>Ежедневно, 08:00–22:00</p></div><div class=box><b>Частые вопросы</b><details><summary>Сколько занимает доставка?</summary><p class=mu>Обычно 35–50 минут по городу.</p></details><details><summary>Как отменить заказ?</summary><p class=mu>В карточке заказа, пока курьер его не забрал.</p></details><details><summary>Когда доставка бесплатная?</summary><p class=mu>При заказе от 150 сом.</p></details></div>`;
return `<div class=box><div class=tr><span>Версия</span><b>1.0 (демо)</b></div><p class=mu>Данные корзины, заказов и адресов хранятся в вашем браузере. Реальные платежи не проводятся.</p><button class="btn r" data-a=reset>Сбросить демо-данные</button></div>`}};
const T={cats:'Категории',list:'Каталог',prod:'Товар',stores:'Магазины',store:'Магазин',cart:'Корзина',checkout:'Оформление заказа',orders:'Мои заказы',order:'Заказ',profile:'Профиль',addrs:'Мои адреса'},IT={lang:'Язык',nt:'Уведомления',help:'Помощь и поддержка',set:'Настройки'};
const stag=o=>`<span class="tag ${o.cancel?'x':''}">${o.cancel?'Отменён':ST[o.step]}</span>`;
const stp2=()=>`<span class=st><button data-a=qm>−</button><i>${Q}</i><button data-a=qp>+</button></span>`;
function flt(f){let r=P.filter(p=>(!f||p.c==f)&&(!F.max||p.p<=F.max)&&(!F.q||(p.n+p.d+sh(p.s).n).toLowerCase().includes(F.q.toLowerCase())));if(F.sort)r=r.slice().sort((a,b)=>F.sort=='asc'?a.p-b.p:b.p-a.p);return r}
function fl(){const l=$('#lst');if(l)l.innerHTML=grid(flt(cur().split(':')[1]))}
function render(){const y=scrollY,[r,a]=cur().split(':');
if(S.out){$('#app').innerHTML=`<div class=ce style="padding-top:90px"><div class=logo style="font-size:44px">TAJ24</div><p class=mu>Продукты, товары и услуги с доставкой</p><input type=tel value="+992 90 123 45 67" style="text-align:center"><button class=btn data-a=login>Войти</button></div>`;return}
const title=r=='info'?IT[a]:T[r];
const hd=r=='home'||r=='success'?'':`<div class=hd>${H.length>1?'<button class=ib data-a=back>‹</button>':''}${title}${['list','cats','store','stores'].includes(r)?`<span class=pill data-a=tab data-v=cart>Корзина · ${cnt()}</span>`:''}</div>`;
const nav=[['Главная','home'],['Категории','cats'],['Корзина','cart'],['Заказы','orders'],['Профиль','profile']].map(x=>`<div class="${H[0]==x[1]?'on':''}" data-a=tab data-v=${x[1]}><svg viewBox="0 0 24 24">${IC[x[1]]}</svg>${x[0]}${x[1]=='cart'&&cnt()?`<em>${cnt()}</em>`:''}</div>`).join('');
$('#app').innerHTML=hd+V[r](a)+(['prod','checkout','success'].includes(r)?'':`<div class=bn>${nav}</div>`);scrollTo(0,y)}
/* ===== Действия ===== */
function finish(){let ad;if(ck.d=='home'){let x=S.ad.find(z=>z.id==ck.a);if(!x){x={id:Date.now(),t:'Новый',s:ck.f.s,b:ck.f.b||'-',a:ck.f.a||'-',n:ck.f.n||'',p:ck.f.p};S.ad.push(x)}ad=`${x.s}, д. ${x.b}, кв. ${x.a}`+(x.n?` (${x.n})`:'')}else{const s=sh(ck.ps);ad=`Самовывоз: ${s.n}, ${s.ad}`}
const o=mk(Object.keys(S.cart).map(k=>[+k,S.cart[k]]),ck.d,ck.p,ad,0);S.orders.unshift(o);S.cart={};ck={a:0,d:'home',p:'cash',ps:'m',f:{}};sv();$('#ovl').innerHTML='';go('success:'+o.id,1)}
const A={go:v=>go(v),tab:v=>go(v,1),back,
cat:v=>{H[H.length-1]='list:'+v;render()},mx:v=>{F.max=+v;render()},
add:v=>{S.cart[v]=(S.cart[v]||0)+1;sv();render();toast('Добавлено в корзину')},
inc:v=>{S.cart[v]++;sv();render()},dec:v=>{if(--S.cart[v]<=0)delete S.cart[v];sv();render()},del:v=>{delete S.cart[v];sv();render()},
clr:()=>{S.cart={};sv();render()},qp:()=>{Q++;render()},qm:()=>{Q=Math.max(1,Q-1);render()},
addq:v=>{S.cart[v]=(S.cart[v]||0)+Q;Q=1;sv();back();toast('Добавлено в корзину')},
ck:v=>{const[k,x]=v.split(':');ck[k]=k=='a'&&x!='new'?+x:x;render()},
place:()=>{if(ck.d=='home'&&ck.a=='new'&&(!(ck.f.s||'').trim()||!(ck.f.p||'').trim()))return toast('Укажите улицу и телефон');
if(ck.p=='cash')return finish();$('#ovl').innerHTML=`<div class=ov><div><b>${PAY[ck.p]}</b><p class=mu style="margin:4px 0">Демо-режим: реальные данные карты не вводите, они не сохраняются.</p>${ck.p=='card'?'<input placeholder="Номер карты" inputmode=numeric autocomplete=off><div class=row><input placeholder="ММ/ГГ" autocomplete=off><input placeholder="CVV" autocomplete=off></div>':'<div class=box style="margin:8px 0;text-align:center"><small>Подтвердите оплату в электронном кошельке</small></div>'}<button class=btn data-a=pay>Оплатить</button><button class="btn o" style="margin-top:8px" data-a=cl>Отмена</button></div></div>`},
cl:()=>$('#ovl').innerHTML='',pay:(v,t)=>{t.disabled=1;t.textContent='Обработка…';setTimeout(finish,1200)},
ords:v=>{H=['orders','order:'+v];render();scrollTo(0,0)},
next:v=>{const o=S.orders.find(x=>x.id==v);if(o.step<5)o.step++;sv();render();toast(ST[o.step])},
cncl:v=>{S.orders.find(x=>x.id==v).cancel=1;sv();render()},
sad:()=>{if(!(ck.f.s||'').trim()||!(ck.f.p||'').trim())return toast('Укажите улицу и телефон');S.ad.push({id:Date.now(),t:'Новый',s:ck.f.s,b:ck.f.b||'-',a:ck.f.a||'-',n:ck.f.n||'',p:ck.f.p});ck.f={};sv();render();toast('Адрес сохранён')},
dad:v=>{S.ad=S.ad.filter(x=>x.id!=v);ck.a=0;sv();render()},
nt:v=>{S.nt[v]=S.nt[v]?0:1;sv();render()},toast2:()=>toast('Этот язык скоро появится'),
out:()=>{S.out=1;H=['home'];sv();render()},login:()=>{S.out=0;sv();render()},
reset:()=>{try{localStorage.removeItem('taj24ru')}catch(x){}S=structuredClone(D0);S.init=1;S.orders=seed();sv();H=['home'];render();toast('Данные сброшены')}};
document.addEventListener('click',ev=>{const t=ev.target.closest('[data-a]');if(t&&A[t.dataset.a])A[t.dataset.a](t.dataset.v,t)});
render();
</script></body></html>
